<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <title>Sign- Up Page</title>
     <style>
          /* HEADER STARTS */
          #sign {
               /* main heading */
               text-align: center;
               font-size: xx-large;
               font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
          }

          /* navigation pannel starts */
          .navigation {
               /* navigation bar */
               background-color: rgb(17, 174, 17);
               font-size: larger;
               font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
          }

          a {
               /* navigation links */
               color: white;
               text-decoration: none;
          }

          /* navigation pannel ends */
          /* HEADER ENDS */

          /* MAIN STARTS */
          /* form details start */
          .main {
               width: 400px;
               margin: 80px auto 0px auto;
               font-family: 'Arial Narrow Bold', sans-serif;
               font-size: medium;
               border-radius: 9px;
               background-color: rgb(231, 231, 225);
               border: 1px soid rgba(255, 255, 255, 0.3);
               box-shadow: 1px 1px 3px;
          }

          form {
               margin: 40px;
          }

          .in {
               width: 300px;
          }

          input {
               border: 1px solid #b8b0b0;
               border-radius: 3px;
               outline: 0px;
               padding: 7px;
          }

          #sub {
               width: 300px;
               padding: 9px;
               font-weight: 589;
               font-size: 18PX;
               border: none;
               border-radius: 3px;
               color: rgb(116, 84, 40);
               background-color: rgb(176, 173, 164);
               cursor: pointer;
               border: 1px solid rgba(255, 255, 255, 0.3);
               box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
               margin-bottom: 10px;
          }

          label,
          span {
               text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
               ;
          }

          /* form details end */
          /* MAIN ENDS */

          /* FOOTER STARTS */
          /* contact details */
          .tb {
               padding: 2%;
               color: white;
               background-color: rgb(45, 44, 44);
          }

          .span {
               margin: 1%;
               font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
          }

          /* FOOTER ENDS */
     </style>
</head>
<body>
     <!-- HEADER STARTS -->
     <header>
          <section>
               <h1 id="sign">SIGN- UP</h1>
          </section>
          <section>
               <nav class="navigation">
                    <table border="0" cellspacing="10" cellpadding="10" align="center" width="1020" height="100">
                         <tr align="center">
                              <td><a href="index.html">Home</a></td>
                              <td><a href="images.html">Images</a></td>
                              <td><a href="audios.html">Audio</a></td>
                              <td><a href="videos.html">Video</a></td>
                              <td><a href="#signup.html">Sign- Up</a></td>
                         </tr>
                    </table>
               </nav>
          </section>
     </header>
     <!-- HEADER ENDS -->

     <!-- MAIN STARTS -->
     <main>
          <section>
               <div class="main">
                    <form>
                         <br>
                         <!-- FIRST NAME -->
                         <label>First Name : </label><br>
                         <input type="text" name="fname" placeholder="Enter your First Name" class="in">
                         <br><br>
                         <!-- LAST NAME -->
                         <label>Last Name : </label><br>
                         <input type="text" name="lname" placeholder="Enter your Last Name" class="in">
                         <br><br>
                         <!-- E- MAIL ADDRESS -->
                         <label>Email : </label><br>
                         <input type="email" placeholder="Give your Valid Email" name="email" class="in">
                         <br><br>
                         <!-- GENDER -->
                         <label>Gender : </label><br>&nbsp;&nbsp;&nbsp;
                         <input type="radio" name="gender" value="male">&nbsp;
                         <span>Male</span>
                         &nbsp;&nbsp;&nbsp;&nbsp;
                         <input type="radio" name="gender" value="female">&nbsp;
                         <span>Female</span>
                         &nbsp;&nbsp;&nbsp;&nbsp;
                         <input type="radio" name="gender" value="other">&nbsp;
                         <span>Other</span>
                         <br><br>
                         <input type="submit" value="SUBMIT" name="submit" id="sub">
                         <br><br>
                    </form>
               </div>
          </section>
          <br><br>
     </main>
     <!-- MAIN ENDS -->

     <!-- FOOTER STARTS -->
     <footer>
          <section class="tb">
               <div style="font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;text-align:start;">
                    <strong>CONTACT US</strong>
               </div>
               <span class="span">Email- samplesite@gmail.com |</span>
               <span class="span">Phone- +91 8882958826 |</span>
               <span class="span">&copy;Harshita Singla</span>
          </section>
     </footer>
     <!-- FOOTER ENDS -->
</body>
</html>
